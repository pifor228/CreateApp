services:
  - type: web
    name: createapp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: createapp-db
          property: connectionString

databases:
  - name: createapp-db
    databaseName: createapp
    user: createapp
    plan: free
